CONFIG_ZMK_POINTING=y

CONFIG_ZMK_BATTERY_REPORTING=y

# Report the left (peripheral) half's battery through the right (central)
# so macOS shows both halves' charge levels.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# NOTE: deep sleep is enabled with the kscan wakeup-source property set
# (see charybdis.dtsi), so any key press wakes each half.
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000
