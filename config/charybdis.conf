CONFIG_ZMK_POINTING=y

CONFIG_ZMK_BATTERY_REPORTING=y

CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# NOTE: CONFIG_ZMK_SLEEP (deep sleep) intentionally disabled. On this
# nice!nano v2 pair the left peripheral kept dropping the split link after
# waking from deep sleep, requiring re-pairing. Plain idle is retained.
