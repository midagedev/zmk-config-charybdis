# This file generates the GitHub Actions matrix.
# The right half is the BLE split central and hosts the trackball,
# so ZMK Studio (live keymap editing UI) is enabled for that build only.
---
include:
  - board: nice_nano_v2
    shield: charybdis_left
  - board: nice_nano_v2
    shield: charybdis_right
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y
  - board: nice_nano_v2
    shield: settings_reset
